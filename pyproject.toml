[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msdpg"
version = "0.1.0"
description = "Multi-sink Decision Predicate Graphs for multi-output random forests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ms-DPG authors"}]
dependencies = ["numpy", "scipy", "scikit-learn>=1.3", "pandas", "networkx", "matplotlib"]

[project.optional-dependencies]
graphviz = ["graphviz"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["msdpg"]

[tool.coverage.report]
fail_under = 90
